name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: 规则引擎单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (DDZ.Core)
        run: dotnet test dotnet-tests/DDZ.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  unity-build:
    name: 云端构建 APK
    runs-on: ubuntu-latest
    needs: core-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-2022.3.76f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-2022.3.76f1-

      - name: 还原 game-ci CLI 缓存
        id: cli-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/game-ci-cli-cache/v0.1.72
          key: game-ci-cli-v0.1.72-linux-x64

      - name: 预取 game-ci CLI（504 时退避重试）
        if: steps.cli-restore.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/game-ci-cli-cache/v0.1.72
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/v0.1.72/scripts/install.sh" \
              | bash -s -- v0.1.72 /tmp/game-ci-cli-cache/v0.1.72 && exit 0
            echo "install attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "game-ci CLI install failed after retries"
          exit 1

      - name: 保存 game-ci CLI 缓存
        if: steps.cli-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/game-ci-cli-cache/v0.1.72
          key: game-ci-cli-v0.1.72-linux-x64

      - name: 构建 Android APK（容器内自动激活许可证）
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          targetPlatform: Android
          unityVersion: auto
          projectPath: .
          buildName: DDZ
          buildsPath: build
          buildMethod: DDZ.Editor.CloudBuild.BuildAndroid
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDZ-Android-APK
          path: build/Android/DDZ.apk
          retention-days: 14
