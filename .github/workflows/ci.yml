name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: 规则引擎单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (DDZ.Core)
        run: dotnet test dotnet-tests/DDZ.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  unity-build:
    name: 云端构建 APK
    runs-on: ubuntu-latest
    needs: core-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-2022.3.76f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-2022.3.76f1-

      - name: 还原 game-ci CLI 缓存
        id: cli-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/game-ci-cli-cache/v0.1.72
          key: game-ci-cli-v0.1.72-linux-x64

      - name: 安装 Bun（源码编译 CLI 的回退手段）
        if: steps.cli-restore.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 预取 game-ci CLI（CDN 504 时退避重试，持续失败则源码编译）
        if: steps.cli-restore.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/game-ci-cli-cache/v0.1.72
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/v0.1.72/scripts/install.sh" \
              | bash -s -- v0.1.72 /tmp/game-ci-cli-cache/v0.1.72 && exit 0
            echo "install attempt $i failed (release CDN 504?), retrying in 20s..."
            sleep 20
          done
          echo "::warning::Release CDN 持续 504，改用源码编译 game-ci CLI"
          cd /tmp
          curl -fsSL "https://github.com/game-ci/cli/archive/refs/tags/v0.1.72.tar.gz" -o cli-src.tar.gz
          tar -xzf cli-src.tar.gz
          cd cli-0.1.72
          bun install
          bun run build:assets
          bun build src/index.ts --compile --target bun-linux-x64 \
            --outfile /tmp/game-ci-cli-cache/v0.1.72/game-ci
          chmod +x /tmp/game-ci-cli-cache/v0.1.72/game-ci
          /tmp/game-ci-cli-cache/v0.1.72/game-ci --version

      - name: 保存 game-ci CLI 缓存
        if: steps.cli-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/game-ci-cli-cache/v0.1.72
          key: game-ci-cli-v0.1.72-linux-x64

      - name: 构建 Android APK（容器内自动激活许可证）
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          targetPlatform: Android
          unityVersion: auto
          projectPath: .
          buildName: DDZ
          buildsPath: build
          buildMethod: DDZ.Editor.CloudBuild.BuildAndroid
          androidExportType: androidPackage
          androidTargetSdkVersion: 33
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDZ-Android-APK
          path: build/Android/DDZ.apk
          retention-days: 14

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: unity-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: DDZ-Android-APK
          path: .
      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: DDZ.apk
          generate_release_notes: true
