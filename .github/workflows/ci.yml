name: CI

on:
  push:
    branches: [main, cocos-main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: 规则引擎测试 (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 缓存测试依赖
        uses: actions/cache@v4
        with:
          path: tests/node_modules
          key: tests-node20-${{ hashFiles('tests/package.json') }}
      - run: npm install --prefix tests --no-audit --no-fund
      - name: 运行规则引擎测试
        run: npm test --prefix tests

  cocos-build:
    name: 云端构建 APK (Cocos Creator 3.8.6)
    runs-on: windows-latest
    needs: core-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cocos-main' || github.event_name == 'workflow_dispatch'
    env:
      CC_VERSION: 3.8.6
      CC_ZIP: CocosCreator-v3.8.6-win-032501.zip
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ===== 缓存层 1：Cocos 编辑器（948MB zip 解压后 ~3GB）=====
      - name: 缓存 Cocos Creator 编辑器
        id: editor-cache
        uses: actions/cache@v4
        with:
          path: C:\cocos-editor
          key: cocos-editor-3.8.6-v1

      - name: 下载解压 Cocos Creator（未命中缓存时，约 10 分钟）
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\cocos-editor | Out-Null
          Invoke-WebRequest -Uri "https://download.cocos.com/CocosCreator/v3.8.6/$env:CC_ZIP" -OutFile C:\cc.zip
          Expand-Archive -Path C:\cc.zip -DestinationPath C:\cocos-editor -Force
          Remove-Item C:\cc.zip

      - name: 定位编辑器
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path C:\cocos-editor -Recurse -Filter "CocosCreator.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "CocosCreator.exe not found"; exit 1 }
          Write-Host "editor: $exe"
          "CC_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ===== 缓存层 2：Android NDK =====
      - name: 缓存并安装 NDK r21e
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: C:\android-ndk-r21e
          key: android-ndk-r21e

      - name: 下载 NDK（未命中时）
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/android-ndk-r21e-windows-x86_64.zip" -OutFile C:\ndk.zip
          Expand-Archive -Path C:\ndk.zip -DestinationPath C:\ -Force
          Remove-Item C:\ndk.zip

      # ===== 缓存层 3：项目 library（Cocos 资源导入缓存）=====
      # restore-keys 固定前缀命中最近一次缓存；精确键带 run_number 使每轮都保存新快照
      - name: 缓存项目 library
        uses: actions/cache@v4
        with:
          path: library
          key: cocos-library-android-v2-${{ github.run_number }}
          restore-keys: cocos-library-android-v2-

      - name: 确保 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = "$env:LOCALAPPDATA\Android\Sdk"
          if (-not (Test-Path $sdk)) { $sdk = "$env:ANDROID_HOME" }
          Write-Host "SDK: $sdk"
          "ANDROID_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          $cmd = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter "sdkmanager.bat" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($cmd) {
            # 接受全部许可证（用输入重定向代替 Unix 的 yes 管道）
            "y`ny`ny`ny`ny`ny`ny`ny`ny`n" | & $cmd --licenses | Out-Null
            & $cmd "platforms;android-33" "build-tools;33.0.0" | Out-Null
          } else {
            Write-Host "::warning::sdkmanager 不存在，跳过组件安装（CI 镜像可能已内置）"
          }

      - name: 写入动态 JDK/SDK 路径到构建配置
        shell: pwsh
        run: |
          # 上一轮教训：硬编码 javaHome 指向 17\x64，实际是 17.0.21-9\x64 → ENOENT。
          # 一律用 setup-java 给的 JAVA_HOME 现场改写构建配置，不猜版本号。
          $cfg = Get-Content ci/build-config-android.json -Raw | ConvertFrom-Json
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "ANDROID_SDK = $env:ANDROID_SDK"
          # android 包在 packages.android 下（不是顶层）；Add-Member -Force 兜属性缺失
          $cfg.packages.android | Add-Member -Force -MemberType NoteProperty -Name javaHome -Value $env:JAVA_HOME
          $cfg.packages.android | Add-Member -Force -MemberType NoteProperty -Name sdkPath -Value $env:ANDROID_SDK
          $cfg.packages.android | Add-Member -Force -MemberType NoteProperty -Name ndkPath -Value "C:\android-ndk-r21e"
          $cfg | ConvertTo-Json -Depth 10 | Set-Content ci/build-config-android.json -Encoding utf8
          Write-Host "构建配置 javaHome 已改为运行时探测值"

      - name: 第一阶段：生成 Android 工程（Cocos CLI）
        shell: pwsh
        timeout-minutes: 20
        run: |
          # Cocos 是 GUI 程序，pwsh 的 $LASTEXITCODE 不会被设置（为空）。
          # 必须用 Start-Process -Wait -PassThru 拿真实 ExitCode，并以产物为最终判据。
          # 上一轮教训：构建脚本报错后编辑器子进程卡死不退出，run 挂满 6 小时超时。
          # 这里加 18 分钟硬超时：超时杀进程，以产物（build/android/proj）为准。
          $proc = Start-Process -FilePath $env:CC_EXE `
            -ArgumentList '--project', $env:GITHUB_WORKSPACE, '--build', 'configPath=ci/build-config-android.json' `
            -PassThru -NoNewWindow
          if (-not ($proc | Wait-Process -Timeout 1080 -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::编辑器 18 分钟未退出，强制结束（继续以产物判定）"
            $proc | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process CocosCreator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          Write-Host "exit code: $($proc.ExitCode)"

          $projDir = Join-Path $env:GITHUB_WORKSPACE "build\android\proj"
          if (-not (Test-Path $projDir)) {
            Write-Host "::error::第一阶段产物 build/android/proj 不存在"
            if (Test-Path (Join-Path $env:GITHUB_WORKSPACE "build")) {
              Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Depth 2 | Select-Object FullName | Format-Table
            }
            exit 1
          }
          Write-Host "第一阶段产物验证通过: $projDir"

      - name: 应用图标到安卓工程
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/apply_icons.py build/android/proj

      - name: 第二阶段：编译 APK（stage=make）
        shell: pwsh
        timeout-minutes: 30
        run: |
          $env:COCOS_NDK_PATH = "C:\android-ndk-r21e"
          $env:COCOS_CONSOLE_ROOT = Split-Path $env:CC_EXE
          # NDK/SDK 路径也可经构建参数传入（不同版本字段名不同，两个都给）
          $arg = "stage=make;platform=android;configPath=ci/build-config-android.json;ndkPath=C:\android-ndk-r21e"
          $proc = Start-Process -FilePath $env:CC_EXE `
            -ArgumentList '--project', $env:GITHUB_WORKSPACE, '--build', $arg `
            -PassThru -NoNewWindow
          if (-not ($proc | Wait-Process -Timeout 1680 -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::编辑器 28 分钟未退出，强制结束（继续以产物判定）"
            $proc | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process CocosCreator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          Write-Host "exit code: $($proc.ExitCode)"

          # 产物导向判定：全仓找 APK（不依赖退出码）
          $apk = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Filter "*.apk" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $apk) {
            Write-Host "::error::未找到 APK，build 目录内容："
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Depth 3 | Select-Object FullName | Format-Table
            exit 1
          }
          Write-Host "APK 生成: $apk"
          "APK_PATH=$apk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDZ-Android-APK
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: 上传构建日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-build-logs
          path: |
            cocos-build-*.log
            temp/builder/log/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: cocos-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DDZ-Android-APK
          path: .
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
